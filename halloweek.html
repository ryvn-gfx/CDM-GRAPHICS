
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Halloweek Awards 2026</title>

<style>
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: #17191b;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    /* High-resolution dark graphite background */
    background-color: #191b1d;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch' seed='7'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.13'/%3E%3C/svg%3E"),
        radial-gradient(
            ellipse at 50% 15%,
            #34383b 0%,
            #25282b 35%,
            #191b1d 75%,
            #111315 100%
        );

    background-blend-mode: soft-light, normal;
    background-attachment: fixed;
}

/* Main gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 265px);
    column-gap: 28px;
    row-gap: 48px;

    width: max-content;
    max-width: 100%;
    margin: 0 auto;
    padding: 35px 20px 70px;
}

/* Each award */
.award {
    width: 265px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
}

/* Exact original image dimensions */
.medal {
    display: block;
    width: 265px;
    height: 211px;
    max-width: none;
    object-fit: fill;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

/* Animation button */
.animation-btn {
    padding: 10px 20px;
    min-width: 110px;

    background: #1c1c1c;
    color: #f5d2a5;

    border: 1px solid #c47a20;
    border-radius: 4px;

    font-size: 14px;
    cursor: pointer;
    transition: background .2s, color .2s, border-color .2s;
}

.animation-btn:hover {
    background: #c47a20;
    color: #111;
}

.animation-btn.active {
    background: #c47a20;
    color: #111;
}

/* Responsive */
@media (max-width: 920px) {
    .gallery {
        grid-template-columns: repeat(2, 265px);
    }
}

@media (max-width: 610px) {
    .gallery {
        grid-template-columns: 265px;
    }
}
</style>
</head>

<body>

<main class="gallery" id="gallery"></main>

<script>
const medals = [
    "https://iili.io/nNL89YN.png",
    "https://iili.io/nNtRYqG.png",
    "https://iili.io/nNtnzrP.png",
    "https://iili.io/nNt3iga.png",
    "https://iili.io/nNZyLJV.png",
    "https://iili.io/nNZmqzu.png",
    "https://iili.io/nNZQmFI.png",
    "https://iili.io/nNZiR2e.png",
    "https://iili.io/nNZ6Tt2.png"
];

const gallery = document.getElementById("gallery");

medals.forEach((url, index) => {
    const award = document.createElement("div");
    award.className = "award";

    const image = document.createElement("img");
    image.className = "medal";
    image.alt = "Halloweek Medal " + (index + 1);
    image.width = 265;
    image.height = 211;

    const button = document.createElement("button");
    button.className = "animation-btn";
    button.textContent = "Animation";

    let playing = false;
    let staticFrame = null;

    // Capture the first frame as a still preview.
    const loader = new Image();

    loader.crossOrigin = "anonymous";

    loader.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = loader.naturalWidth;
        canvas.height = loader.naturalHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(loader, 0, 0);

        try {
            staticFrame = canvas.toDataURL("image/png");
            if (!playing) image.src = staticFrame;
        } catch (e) {
            // Cross-origin restrictions may prevent capture.
            // Use the original image as fallback.
            if (!playing) image.src = url;
        }
    };

    loader.onerror = () => {
        image.src = url;
    };

    loader.src = url;

    button.addEventListener("click", () => {
        playing = !playing;

        if (playing) {
            // Reload APNG to start animation from frame 1.
            image.src = url;
            button.textContent = "Stop Animation";
            button.classList.add("active");
        } else {
            image.src = staticFrame || url;
            button.textContent = "Animation";
            button.classList.remove("active");
        }
    });

    award.appendChild(image);
    award.appendChild(button);
    gallery.appendChild(award);
});
</script>

</body>
</html>
