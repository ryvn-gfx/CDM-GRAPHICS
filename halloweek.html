
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VR Halloweek Awards 2026</title>

<style>
* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
    background: #0c0d0e;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    color: #fff;

    /* Dark, fine-grain graphite texture */
    background-color: #0c0d0e;
    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.72' numOctaves='3' stitchTiles='stitch' seed='7'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.09'/%3E%3C/svg%3E"),
        radial-gradient(
            ellipse at 50% 12%,
            #202225 0%,
            #141618 40%,
            #0c0d0e 85%
        );
    background-blend-mode: soft-light, normal;
    background-attachment: fixed;
}

/* Header */
.header {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 20px 8px;
    text-align: center;
}

.vr-logo {
    display: block;
    width: 194px;
    height: 105px;
    object-fit: contain;
}

/* Gallery */
.gallery {
    display: grid;
    grid-template-columns: repeat(3, 265px);
    column-gap: 12px;
    row-gap: 18px;
    width: max-content;
    max-width: 100%;
    margin: 0 auto;
    padding: 20px 10px 45px;
}

/* Award */
.award {
    width: 265px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 7px;
}

/* Original medal dimensions */
.medal {
    display: block;
    width: 265px;
    height: 211px;
    max-width: none;
    object-fit: fill;
    border: none;
    border-radius: 0;
    box-shadow: none;
}

/* Minimal animation button */
.animation-btn {
    padding: 5px 9px;
    min-width: 0;
    background: #252729;
    color: #bfc1c3;
    border: none;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: .8px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, color .2s;
}

.animation-btn:hover {
    background: #393c40;
    color: #fff;
}

.animation-btn.active {
    background: #45484b;
    color: #fff;
}

/* Responsive */
@media (max-width: 825px) {
    .gallery {
        grid-template-columns: repeat(2, 265px);
    }
}

@media (max-width: 550px) {
    .gallery {
        grid-template-columns: 265px;
    }
}
</style>
</head>

<body>

<header class="header">
    <img
        class="vr-logo"
        src="https://iili.io/nNtMMs2.png"
        width="194"
        height="105"
        alt="VR Logo"
    >
</header>

<main class="gallery" id="gallery"></main>

<script>
const medals = [
    "https://iili.io/nNL89YN.png",
    "https://iili.io/nNtRYqG.png",
    "https://iili.io/nNtnzrP.png",
    "https://iili.io/nNt3iga.png",
    "https://iili.io/nNZyLJV.png",
    "https://iili.io/nNZmqzu.png",
    "https://iili.io/nNZQmFI.png",
    "https://iili.io/nNZiR2e.png",
    "https://iili.io/nNZ6Tt2.png"
];

const gallery = document.getElementById("gallery");

medals.forEach((url, index) => {
    const award = document.createElement("div");
    award.className = "award";

    const image = document.createElement("img");
    image.className = "medal";
    image.alt = "Halloweek Medal " + (index + 1);
    image.width = 265;
    image.height = 211;

    const button = document.createElement("button");
    button.className = "animation-btn";
    button.textContent = "ANIMATION";

    let playing = false;
    let staticFrame = null;

    const loader = new Image();
    loader.crossOrigin = "anonymous";

    loader.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = loader.naturalWidth;
        canvas.height = loader.naturalHeight;

        const ctx = canvas.getContext("2d");
        ctx.drawImage(loader, 0, 0);

        try {
            staticFrame = canvas.toDataURL("image/png");
            if (!playing) image.src = staticFrame;
        } catch (e) {
            if (!playing) image.src = url;
        }
    };

    loader.onerror = () => {
        image.src = url;
    };

    loader.src = url;

    button.addEventListener("click", () => {
        playing = !playing;

        if (playing) {
            image.src = url;
            button.textContent = "STOP";
            button.classList.add("active");
        } else {
            image.src = staticFrame || url;
            button.textContent = "ANIMATION";
            button.classList.remove("active");
        }
    });

    award.appendChild(image);
    award.appendChild(button);
    gallery.appendChild(award);
});
</script>

</body>
</html>
