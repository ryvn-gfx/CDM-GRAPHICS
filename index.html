<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 20px;
        }
        header {
            max-width: 1400px;
            margin: 0 auto 40px auto;
        }
        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        p {
            color: #888;
            font-size: 1rem;
        }

        /* Masonry Grid Setup (Tumblr stijl) */
        .portfolio-grid {
            max-width: 1400px;
            margin: 0 auto;
            column-count: 2; /* Aantal kolommen voor desktop */
            column-gap: 24px;
        }
        
        .portfolio-item {
            background: #161616;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease;
            margin-bottom: 24px; /* Ruimte onder elk item */
            break-inside: avoid; /* Voorkomt dat een blok over twee kolommen wordt gesplitst */
            display: inline-block;
            width: 100%;
        }
        
        .portfolio-item:hover {
            transform: translateY(-4px);
        }

        /* Media containers passen zich aan de verhouding van de bron aan */
        .media-container {
            background: #000;
            display: block;
        }
        
        /* Video's en afbeeldingen behouden hun verhouding (aspect ratio) */
        .media-container video, 
        .media-container img {
            display: block;
            width: 100%;
            height: auto;
        }

        .project-info {
            padding: 20px;
        }
        .project-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .project-tag {
            color: #666;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        /* Responsief: 1 kolom op kleinere schermen */
        @media (max-width: 900px) {
            .portfolio-grid {
                column-count: 1;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <p>Geselecteerd werk — HD Video & APNG Loops</p>
    </header>

    <main class="portfolio-grid">

        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="SignaturePringles2.mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Signature Pringles</div>
                <div class="project-tag">1024x512 Video</div>
            </div>
        </div>

        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="lunatica_hd-2_s.mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Lunatica HD</div>
                <div class="project-tag">Verticale Video</div>
            </div>
        </div>
        
        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="Jinx_transrender.mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Jinx Transrender</div>
                <div class="project-tag">HD Video</div>
            </div>
        </div>
        
        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="minty_minxy.mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Minty Minxy</div>
                <div class="project-tag">HD Video</div>
            </div>
        </div>
        
        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="FULLANIMHEX(1).mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Full Anim Hex</div>
                <div class="project-tag">HD Video</div>
            </div>
        </div>

        <div class="portfolio-item">
            <div class="media-container">
                <img src="jouw-afbeelding.png" alt="APNG animatie">
            </div>
            <div class="project-info">
                <div class="project-title">Project Naam Drie</div>
                <div class="project-tag">Natieve APNG Loop</div>
            </div>
        </div>

    </main>

</body>
</html>
