<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mijn Portfolio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            padding: 40px 20px;
        }
        header {
            max-width: 1920px;
            margin: 0 auto 60px auto;
            text-align: center; /* Optioneel: past beter bij een gecentreerde feed */
        }
        h1 {
            font-size: 2rem;
            font-weight: 500;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        p {
            color: #888;
            font-size: 1rem;
        }

        /* Tumblr-stijl gecentreerde endless scroll */
        .portfolio-grid {
            display: flex;
            flex-direction: column;
            align-items: center; 
            gap: 60px; /* Iets meer ruimte tussen posts */
            max-width: 1920px;
            margin: 0 auto;
        }
        
        .portfolio-item {
            background: #161616;
            border-radius: 12px;
            overflow: hidden;
            width: fit-content; 
            max-width: 100%; /* Voorkomt dat de container breder wordt dan het scherm */
        }

        .media-container {
            background: #000;
            display: flex;
            justify-content: center;
        }
        
        .media-container video, 
        .media-container img {
            display: block;
            width: auto;  
            height: auto; 
            max-width: 100%; /* Schaal horizontaal mee op kleine schermen */
            max-height: 85vh; /* Zorgt dat verticale video's (zoals 1000x1300) altijd in je scherm passen */
            object-fit: contain;
        }

        .project-info {
            padding: 20px;
            width: 100%;
        }
        .project-title {
            font-size: 1.1rem;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .project-tag {
            color: #666;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>

    <header>
        <h1>Portfolio</h1>
        <p>Geselecteerd werk — HD Video & APNG Loops</p>
    </header>

    <main class="portfolio-grid">

        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="SignaturePringles2.mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Signature Pringles</div>
                <div class="project-tag">HD Motion Design</div>
            </div>
        </div>

        <div class="portfolio-item">
            <div class="media-container">
                <!-- Voorbeeld van de 1000x1300 verticale video of APNG -->
                <img src="jouw-afbeelding.png" alt="APNG animatie">
            </div>
            <div class="project-info">
                <div class="project-title">Project Verticaal</div>
                <div class="project-tag">Natieve APNG Loop</div>
            </div>
        </div>

        <div class="portfolio-item">
            <div class="media-container">
                <video autoplay loop muted playsinline>
                    <source src="jouw-video2.mp4" type="video/mp4">
                </video>
            </div>
            <div class="project-info">
                <div class="project-title">Project Naam Drie</div>
                <div class="project-tag">HD MP4 Video</div>
            </div>
        </div>

    </main>

</body>
</html>
